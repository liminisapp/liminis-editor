# Publish to npm with provenance.
#
# Publishing happens here rather than from a laptop for two reasons:
#
#   - **Provenance.** npm's attestation links the published tarball to this
#     repository, this workflow and the exact commit it was built from. It can
#     only be produced by a CI publish from a public repo, so a local `npm
#     publish` cannot carry it however careful the operator is.
#   - **2FA.** An interactive publish prompts for a one-time code, and a token
#     does not help: npm has removed classic automation tokens, and a granular
#     token still hits `EOTP` when the account requires 2FA for writes. Trusted
#     publishing is npm's sanctioned answer — the registry trusts *this
#     repository and workflow* via OIDC, so there is no long-lived credential
#     to hold, scope or rotate at all.
#
# Triggered by publishing a GitHub Release, so the tag, the release notes and
# the npm version are decided in one place and the audit trail is a real
# artifact rather than shell history.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required twice over: it is how npm authenticates this workflow as a
  # trusted publisher, and how provenance is attested. Without it the publish
  # cannot authenticate at all.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hang here strands a release with its tag already cut, so cap it too.
    # Higher than the CI jobs because this one runs the full suite, the
    # package verification and the build before publishing.
    timeout-minutes: 20

    steps:
      # This job installs dependencies and runs their lifecycle scripts, so the
      # checkout token must not be left in .git/config for that code to read —
      # the same reasoning ci.yml and pages.yml apply.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      # Node 24, matching ci.yml and pages.yml — every workflow in this
      # repository now runs the same major.
      #
      # This job reached 24 first, and not as a preference: trusted publishing
      # needs npm 11.5.1+, and npm cannot simply be installed over an older
      # Node. npm 12 declares `node: ^22.22.2 || ^24.15.0 || >=26`, so
      # installing it on Node 20 fails with EBADENGINE. The publishing client
      # and the runtime move together or not at all.
      #
      # Keep this in step with ci.yml if either moves. The suite runs again
      # below on this Node, so a release that works only on the version CI
      # used would fail here rather than reach the registry.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      # Pinned, not `@latest`: this is a release path, and a new npm major
      # arriving unannounced is exactly the kind of change that should not
      # happen between a tag being cut and the artifact it produces. Bump it
      # deliberately; the floor for trusted publishing is 11.5.1.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@12.0.2
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The package is built by `prepack` during publish, but the full suite is
      # run first so a release cannot ship something that does not pass. This
      # duplicates ci.yml deliberately: ci.yml gates merges, this gates
      # releases, and a release can be cut from a commit whose CI has expired.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify the package is publishable
        run: pnpm verify:package

      # Refuse a release whose version does not match the tag it was cut from.
      # Without this, publishing from a stale branch quietly ships the wrong
      # version under the right tag.
      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME implies version $TAG, package.json says $PKG" >&2
            exit 1
          fi
          echo "tag and package.json agree on $PKG"

      # A prerelease must not become `latest`, or `npm install @liminis/editor`
      # starts handing an rc to anyone who asks for the package.
      - name: Determine the dist-tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*) echo "dist=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # No NODE_AUTH_TOKEN: authentication is the OIDC exchange, which npm
      # performs itself when the package has this repository and workflow
      # registered as a trusted publisher.
      - name: Publish
        run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.dist }}"
        env:
          # The publish guard's deliberate opt-in. Scoped to this step, so no
          # other job in this repository can publish as a side effect.
          LIMINIS_ALLOW_PUBLISH: '1'

  # Installs the release the way a consumer does, by bare name, after it is
  # published. Matches liminis-diagrams' job of the same name.
  #
  # Node 20 is deliberate: it is below this package's `engines` floor (>=22).
  # npm prefers an engines-compatible version over the `latest` tag, so any
  # published version that declares no `engines` is what a consumer below the
  # floor silently gets. 0.1.0-rc.1 through 0.1.1 predate the floor and do
  # exactly that — on Node 20, `npm install @liminis/editor` resolved 0.1.1
  # when 0.7.0 was latest. Deprecating them does not help (npm ranks engine
  # compatibility above deprecation); only removing them does. This job is
  # how we know whether that is still true.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20' # below-engines-floor: what a consumer under >=22 resolves

      - name: Install by bare name and check the resolved version
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          WANT=$(node -p "require('./package.json').version")
          echo "expecting $NAME@$WANT"

          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          echo '{"name":"smoke","version":"1.0.0","private":true}' > package.json

          # Two questions, answered separately, because they fail for different
          # reasons and call for different responses.
          #
          # 1. Has the registry caught up? A fresh publish takes a while to
          #    appear: v0.7.0's version was still absent from the packument
          #    over two minutes after `npm publish` returned. Not seeing it yet
          #    says nothing about the package, so wait for it, and if it never
          #    appears, say that rather than blaming the package.
          visible=""
          for attempt in $(seq 1 40); do
            if [ "$(npm view "$NAME@$WANT" version --prefer-online 2>/dev/null || true)" = "$WANT" ]; then
              echo "registry lists $NAME@$WANT (check $attempt)"
              visible=1
              break
            fi
            echo "check $attempt: registry does not list $NAME@$WANT yet — waiting 15s"
            sleep 15
          done
          if [ -z "$visible" ]; then
            echo
            echo "INCONCLUSIVE: the registry still does not list $NAME@$WANT after ~10"
            echo "minutes. This is registry lag, not a defect in the package: check"
            echo "'npm view $NAME versions' and re-run this job once it appears."
            npm view "$NAME" versions dist-tags --prefer-online || true
            exit 1
          fi

          # 2. Does the bare name resolve to it? Now that the version is
          #    listed, anything else means a lower version is shadowing this
          #    release (on Node 20, below the engines floor). A short retry
          #    remains for the install path's own cache.
          for attempt in 1 2 3 4 5 6; do
            rm -rf node_modules
            npm install --no-audit --no-fund --omit=peer --prefer-online "$NAME" >/dev/null 2>&1 || true
            GOT=$(node -p "require('$RUNNER_TEMP/smoke/node_modules/$NAME/package.json').version" 2>/dev/null || echo "none")
            if [ "$GOT" = "$WANT" ]; then
              echo "attempt $attempt: resolved $GOT — correct"
              exit 0
            fi
            echo "attempt $attempt: resolved '$GOT', want '$WANT' — retrying in 20s"
            sleep 20
          done

          echo
          echo "FAILED: 'npm install $NAME' resolved to '$GOT', not '$WANT'."
          echo "A lower version is shadowing this release for anyone below the"
          echo "engines floor: a published version with no engines field wins"
          echo "over latest there. For this package that has been 0.1.0-rc.1 to"
          echo "0.1.1, which predate the floor; deprecating them does not help."
          npm view "$NAME" versions dist-tags --prefer-online || true
          exit 1
