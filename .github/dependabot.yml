# Dependency updates arrive as PRs to judge on their own merits: merge the
# green ones. A major that needs code changes is better done as a worked PR
# of its own; close the Dependabot PR (which ignores that version) once that
# work is under way. Weekly, Saturdays 04:00 Eastern.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /site
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # @types/node follows the Node we run (.nvmrc, every workflow's
      # node-version), not the newest Node published. Its majors arrive when
      # we raise that Node, in the same change; minors and patches still
      # come through. tests/node-version-contract.test.ts fails if the three
      # disagree, so this rule cannot hold the types behind the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      instantdb:
        patterns: ["@instantdb/*", "instant-cli"]
      # Its own group, ahead of runtime-non-major (a dependency joins the first
      # group it matches). It is pinned at 2.1.2 until annotate mode stops
      # exposing its sentinels to the escaper (#157; see the
      # //mdast-util-to-markdown note in package.json), so every update to it fails CI by design. Alone,
      # that red PR is a visible reminder; inside the runtime group it held
      # every other runtime update hostage. Not ignored: the PR that goes green
      # is how we learn the blocker is gone.
      mdast-util-to-markdown:
        patterns: ["mdast-util-to-markdown"]
      runtime-non-major:
        dependency-type: production
        update-types: [minor, patch]
      dev-non-major:
        dependency-type: development
        update-types: [minor, patch]
      # Any other major: one PR per dependency, across every directory above.
      majors:
        update-types: [major]
        group-by: dependency-name

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
